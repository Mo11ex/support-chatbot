experiment_name: "stage2-baseline-classifier"
run_name: "rubert-tiny2-baseline"

model_name: "cointegrated/rubert-tiny2"
text_column: "text_original"
label_column: "label"

paths:
  train: "ml/data/splits/stage1/train_augmented.csv"
  val: "ml/data/splits/stage1/val.csv"
  test: "ml/data/splits/stage1/test.csv"
  heldout: "ml/data/heldout/heldout_200_stage2.csv"

  model_output_dir: "ml/models/classifier/stage2-rubert-tiny2-baseline"
  report_dir: "ml/logs/reports/stage2_baseline_classifier"

training:
  seed: 42
  learning_rate: 5.0e-5
  batch_size: 32
  eval_batch_size: 64
  num_train_epochs: 10
  weight_decay: 0.01
  max_length: 128
  early_stopping_patience: 2
  logging_steps: 50