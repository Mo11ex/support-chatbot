experiment_name: "stage3-targeted-patch"
run_name: "rubert-tiny2-patched"

model_name: "cointegrated/rubert-tiny2"
text_column: "text_original"
label_column: "label"

paths:
  train: "ml/data/splits/stage3/train_stage3_patched.csv"
  val: "ml/data/splits/stage1/val.csv"
  test: "ml/data/splits/stage1/test.csv"
  heldout: "ml/data/heldout/heldout_200_stage2.csv"

  model_output_dir: "ml/models/classifier/stage3-rubert-tiny2-patched"
  report_dir: "ml/logs/reports/stage3_rubert_tiny2_patched"

training:
  seed: 42
  learning_rate: 5.0e-5
  batch_size: 32
  eval_batch_size: 64
  gradient_accumulation_steps: 1
  num_train_epochs: 10
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_length: 128
  early_stopping_patience: 2
  logging_steps: 50